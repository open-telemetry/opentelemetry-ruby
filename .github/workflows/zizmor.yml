name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 15 * * 2' # weekly at 15:27 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-ruby' }}
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@8079110d7e793bd38b1a5219ef8f8280dab9139e # v0.7.0
