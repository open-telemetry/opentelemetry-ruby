name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 15 * * 2' # weekly at 15:27 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-ruby' }}
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@ad1959372f2919fcf2556d3a3d12ed5265c54209 # v0.16.0
