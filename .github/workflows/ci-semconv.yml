name: Semantic Conventions ci check

on:
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - '.github/workflows/ci-semconv.yml'
      - 'semantic_conventions/compose.yml'
      - 'semantic_conventions/Rakefile'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate-semconv:
    runs-on: ubuntu-24.04
    steps:
      - name: Create otelbot app token
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.OTELBOT_RUBY_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_RUBY_PRIVATE_KEY }}
          permission-contents: write

      - name: Fork checkout
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          # zizmor: ignore[artipacked] Credentials are required by the Renovate branch push below.
          persist-credentials: true

      - name: Local checkout
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: semantic_conventions

      - name: Regenerate semantic conventions
        working-directory: semantic_conventions
        run: bundle exec rake generate

      - name: Check for changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff "origin/$BASE_REF" HEAD -- semantic_conventions/Rakefile | grep -q "SPEC_VERSION"; then
            echo "spec_version=true" >> $GITHUB_OUTPUT
          else
            echo "spec_version=false" >> $GITHUB_OUTPUT
          fi
          git add semantic_conventions/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "files=false" >> $GITHUB_OUTPUT
          else
            echo "files=true" >> $GITHUB_OUTPUT
          fi

      - name: Log changes
        if: ${{ steps.changes.outputs.spec_version == 'false' && steps.changes.outputs.files == 'true' }}
        run: |
          git diff --cached
          return 1

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.spec_version == 'true' && steps.changes.outputs.files == 'true' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "otelbot"
          git config user.email "197425009+otelbot@users.noreply.github.com"
          git commit -m "chore: regenerate semantic conventions"
          git push origin "HEAD:${HEAD_REF}"
