name: Otel primitives

on:
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - '**/otel-spec.yaml'
      - '.github/workflows/ci-semconv.yml'
      - 'semantic_conventions/compose.yml'
      - 'semantic_conventions/Rakefile'
      - 'semantic_conventions/lib/**'
      - 'semantic_conventions/templates/**'
      - 'types/**/Rakefile'
      - 'types/**/lib/**'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.set_dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select directories
        id: set_dirs
        shell: bash
        run: |
          # Static list (replace with dynamic detection if needed)
          DIRS='["semantic_conventions", "types/otlp"]'

          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIRS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  regenerate-otel:
    runs-on: ubuntu-24.04
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.plan.outputs.dirs) }}
    name: "${{ matrix.dir }}"
    steps:
      - name: Create otelbot app token
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.OTELBOT_RUBY_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_RUBY_PRIVATE_KEY }}
          permission-contents: write

      - name: Fork checkout
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          # zizmor: ignore[artipacked] Credentials are required by the Renovate branch push below.
          persist-credentials: true

      - name: Local checkout
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: ${{ matrix.dir }}

      - name: Install protoc
        run: |
          PROTOC_VERSION=3.2.0
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          unzip protoc-${PROTOC_VERSION}-linux-x86_64.zip -d $HOME/.local
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        # run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Regenerate ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: bundle exec rake generate

      - name: Check for changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          DIR_SCOPE: ${{ matrix.dir }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff "origin/$BASE_REF" HEAD -- ${DIR_SCOPE}/otel-spec.yaml | grep -q "# ${DIR_SCOPE}"; then
            echo "spec_version=true" >> $GITHUB_OUTPUT
          else
            echo "spec_version=false" >> $GITHUB_OUTPUT
          fi
          git add ${DIR_SCOPE}/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "files=false" >> $GITHUB_OUTPUT
          else
            echo "files=true" >> $GITHUB_OUTPUT
          fi

      - name: Log changes
        if: ${{ (steps.changes.outputs.spec_version == 'false' || github.event.pull_request.head.repo.fork == true) && steps.changes.outputs.files == 'true' }}
        env:
          DIR_SCOPE: ${{ matrix.dir }}
        run: |
          git diff --cached
          echo "::error:: The ${DIR_SCOPE} files are out of date. If the file changes are intended, commit the updated files locally."
          return 1

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.files == 'true' }}
        env:
          DIR_SCOPE: ${{ matrix.dir }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "otelbot"
          git config user.email "197425009+otelbot@users.noreply.github.com"
          git commit -m "chore: regenerate ${DIR_SCOPE}"
          git push origin "HEAD:${HEAD_REF}"
