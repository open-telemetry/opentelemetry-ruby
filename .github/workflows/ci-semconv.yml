name: Semantic Conventions ci check

on:
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - '.github/workflows/ci-semconv.yml'
      - 'semantic_conventions/compose.yml'
      - 'semantic_conventions/Rakefile'
    branches:
      - main

permissions:
  contents: read

jobs:
  regenerate-semconv:
    runs-on: ubuntu-24.04
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: semantic_conventions

      - name: Regenerate semantic conventions
        working-directory: semantic_conventions
        run: bundle exec rake generate

      - name: Check for changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff "origin/$BASE_REF" HEAD -- semantic_conventions/Rakefile | grep -q "SPEC_VERSION"; then
            echo "spec_version=true" >> $GITHUB_OUTPUT
          else
            echo "spec_version=false" >> $GITHUB_OUTPUT
          fi
          git add semantic_conventions/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "files=false" >> $GITHUB_OUTPUT
          else
            echo "files=true" >> $GITHUB_OUTPUT
          fi

      - name: Log changes
        if: steps.changes.outputs.spec_version == 'false' && steps.changes.outputs.files == 'true'
        run: |
          git diff --cached
          return 1
