services:
  semconv-weaver:
    image: otel/weaver:v0.26.0@sha256:ae8ccf529fffdfd6d2047bd3b476c2869f3765a218b920a78fa55aaa41a18e05
    user: "${UID}:${GID}"
    volumes:
      - ./tmp/semconvrepo/model:/source:ro
      - ./templates:/templates:ro
      - ./:/output
    working_dir: /output
    command:
      [
        "registry",
        "generate",
        "--registry=/source",
        "--templates=/templates",
        "ruby",
        "/output/lib/opentelemetry/semconv"
      ]
