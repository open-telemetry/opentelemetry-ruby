services:
  semconv-weaver:
    image: otel/weaver:v0.25.1
    user: "${UID}:${GID}"
    volumes:
      - ./tmp/semconvrepo/model:/source:ro
      - ./templates:/templates:ro
      - ./:/output
    working_dir: /output
    command:
      [
        "registry",
        "generate",
        "--registry=/source",
        "--templates=/templates",
        "ruby",
        "/output/lib/opentelemetry/semconv"
      ]
