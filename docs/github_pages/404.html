<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="canonical" href="https://opentelemetry.io/ecosystem/registry/?language=ruby">
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://opentelemetry.io/ecosystem/registry/?language=ruby">

    <script>
      const m = location.pathname.match(/^\/opentelemetry-ruby\/([\w-]+)(\/)?(v[0-9.])*/);
      const n = m[2] ? m[2] : '';
      location.replace(m ? `https://rubydoc.info/gems/${m[1]}/${n}` :
        'https://opentelemetry.io/ecosystem/registry/?language=ruby');
    </script>
    <title>Redirecting…</title>
  </head>
  <body>
    <p>If you are not redirected automatically, <a href="https://opentelemetry.io/ecosystem/registry/?language=ruby">click here</a>.</p>
  </body>
</html>
